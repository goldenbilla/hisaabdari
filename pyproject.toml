[project]
name = "hisaabdari"
authors = [
    { name = "HisaabDari contributors" }
]
description = "Simple ERP for small and medium businesses, built on the Frappe Framework"
requires-python = ">=3.14"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    "Unidecode~=1.4.0",
    "barcodenumber~=0.5.0",
    "rapidfuzz~=3.14.3",
    "holidays~=0.87",

    # Still imported by modules that have not been pruned yet.
    "googlemaps~=4.10.0",
    "plaid-python~=7.2.1",
    "python-youtube~=0.9.9",
    "pypng~=0.20220715.0",
    "mt-940>=4.26.0",
    "pdfplumber>=0.11.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.54.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
